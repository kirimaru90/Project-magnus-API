<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Terminale RobCo</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#33ff00">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --terminal-green: #33ff00;
            --terminal-bg: #0a0a0a;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--terminal-bg);
            color: var(--terminal-green);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100%;
            text-shadow: 0 0 5px var(--terminal-green);
        }

        .crt::before {
            content: " "; display: block; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 4px, 6px 100%; pointer-events: none;
        }

        #boot-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--terminal-bg); z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            padding: env(safe-area-inset-top) max(1rem, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(1rem, env(safe-area-inset-left));
            box-sizing: border-box;
        }

        #terminal-container {
            padding: 2rem max(2rem, env(safe-area-inset-right)) 2rem max(2rem, env(safe-area-inset-left));
            max-width: 800px; margin: 0 auto; position: relative; z-index: 1; display: none;
            box-sizing: border-box;
        }

        #screen-content { min-height: 200px; }
        #choices-container { margin-top: 2rem; display: none; }

        .choice-btn {
            display: block; color: var(--terminal-green); background: transparent;
            border: none; font-family: inherit; font-size: 1.1rem;
            text-align: left; cursor: pointer; margin-bottom: 0.5rem; text-shadow: inherit; transition: all 0.2s;
        }

        .choice-btn::before { content: "> "; }
        .choice-btn:hover, .choice-btn:focus { background-color: var(--terminal-green); color: var(--terminal-bg); text-shadow: none; outline: none; }

        .choice-btn-system { opacity: 0.5; text-shadow: none; font-size: 0.9rem; }
        .choice-btn-system:hover, .choice-btn-system:focus { opacity: 1; }

        .system-separator { opacity: 0.3; margin: 0.5rem 0 0.25rem 0; line-height: 1; }

        h1, h2, h3 { text-transform: uppercase; margin-bottom: 1rem; }
        p { line-height: 1.5; }
        .cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #login-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--terminal-bg); z-index: 20;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; gap: 1rem;
            padding: env(safe-area-inset-top) max(1rem, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(1rem, env(safe-area-inset-left));
            box-sizing: border-box;
        }
        #login-screen select,
        #login-screen input[type="password"] {
            background: transparent; color: var(--terminal-green);
            border: 1px solid var(--terminal-green); font-family: inherit;
            font-size: 1rem; padding: 0.4rem; margin: 0.3rem 0;
            text-shadow: 0 0 5px var(--terminal-green); display: block;
        }

        #hidden-input {
            background: transparent; color: var(--terminal-green);
            border: 1px solid var(--terminal-green); font-family: inherit;
            font-size: 1rem; padding: 0.4rem;
            text-shadow: 0 0 5px var(--terminal-green); margin-top: 1rem;
        }
        #login-screen select option { background: var(--terminal-bg); }
        #login-error { color: red; display: none; margin: 0; }

    </style>
</head>
<body class="crt">

    <div id="boot-screen">
        <h2>ROBCO INDUSTRIES - LINK AL DATABASE</h2>
        <p>CONNESSIONE IN CORSO...</p>
        <span class="cursor">_</span>
    </div>

    <div id="login-screen">
        <h2>ACCESSO RISERVATO</h2>
        <p id="login-error">CREDENZIALI NON VALIDE</p>
        <select id="login-username"></select>
        <input type="password" id="login-password" placeholder="PASSWORD">
        <button class="choice-btn" id="login-submit">[ ACCEDI ]</button>
        <button class="choice-btn" id="login-back">[ Torna al menu ]</button>
    </div>

    <div id="terminal-container">
        <div id="screen-content"></div><span class="cursor">_</span>
        <div id="choices-container"></div>
    </div>

    <script>
        const contentDiv = document.getElementById('screen-content');
        const choicesDiv = document.getElementById('choices-container');
        const terminalContainer = document.getElementById('terminal-container');
        const bootScreen = document.getElementById('boot-screen');

        function createSound(path) {
            let audio;
            try { audio = new Audio(path); } catch (_) {}
            return function play() {
                if (!audio) return;
                try {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } catch (_) {}
            };
        }

        function createLoopSound(path) {
            let audio;
            try { audio = new Audio(path); audio.loop = true; } catch (_) {}
            return {
                start() { if (!audio) return; try { audio.currentTime = 0; audio.play().catch(() => {}); } catch (_) {} },
                stop()  { if (!audio) return; try { audio.pause(); audio.currentTime = 0; } catch (_) {} }
            };
        }

        const initSound         = createSound('suoni/init.mp3');
        const dataTerminalSound = createSound('suoni/data_terminal.mp3');
        const typingSound       = createLoopSound('suoni/typing.mp3');
        const hoverSound        = createSound('suoni/hover.mp3');
        const clickSound        = createSound('suoni/click.mp3');
        const selectionSound    = createSound('suoni/selection.mp3');

        let terminalData = {};
        let navigationHistory = [];
        let loggedInUsers = new Map();
        let seenNodes = new Set();
        let currentKeyHandler = null;

        // Author-tunable engine constants. Edit these to change runtime behaviour
        // without touching handler logic. Letter-based shortcuts gate on
        // isTextInputFocused() so they never compete with text input fields.
        const ENGINE_CONFIG = {
            typingSpeed: 15,
            postTypingEnterCooldownMs: 1000,
            scrollStepPx: 40,
        };

        let currentTypingHandle = null;
        let lastTypingEndAt = 0;
        let autoFollowEnabled = true;
        let suppressNextScrollEvent = false;
        let suppressNextClickAfterSkip = false;

        function isTextInputFocused() {
            const el = document.activeElement;
            if (!el) return false;
            const tag = el.tagName;
            if (tag === 'TEXTAREA') return true;
            if (tag === 'INPUT') {
                const type = (el.type || 'text').toLowerCase();
                return ['text','password','email','search','url','tel','number'].includes(type);
            }
            return el.isContentEditable === true;
        }

        function abortCurrentTyping() {
            if (currentTypingHandle && currentTypingHandle.isActive()) {
                currentTypingHandle.cancel();
            }
            typingSound.stop();
        }

        function scrollFocusIntoViewIfNeeded(el) {
            if (!el || typeof el.getBoundingClientRect !== 'function') return;
            const rect = el.getBoundingClientRect();
            if (rect.top < 0 || rect.bottom > window.innerHeight) {
                suppressNextScrollEvent = true;
                el.scrollIntoView({ block: 'nearest', behavior: 'auto' });
            }
        }

        window.addEventListener('scroll', function() {
            if (suppressNextScrollEvent) { suppressNextScrollEvent = false; return; }
            autoFollowEnabled = false;
        }, { passive: true });

        document.addEventListener('keydown', function(e) {
            if (currentTypingHandle && currentTypingHandle.isActive()) {
                if (e.key === 'Enter' || e.key === 'Escape') {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    currentTypingHandle.skip();
                }
            }
        }, true);

        document.addEventListener('pointerdown', function(e) {
            if (!currentTypingHandle || !currentTypingHandle.isActive()) return;
            const isLeftClick = e.pointerType === 'mouse' && e.button === 0;
            const isPrimaryTouch = (e.pointerType === 'touch' || e.pointerType === 'pen') && e.isPrimary;
            if (!isLeftClick && !isPrimaryTouch) return;
            suppressNextClickAfterSkip = true;
            currentTypingHandle.skip();
        }, true);

        document.addEventListener('click', function(e) {
            if (!suppressNextClickAfterSkip) return;
            suppressNextClickAfterSkip = false;
            e.stopPropagation();
            e.preventDefault();
        }, true);

        document.addEventListener('keydown', function(e) {
            if (isTextInputFocused()) return;
            if (e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                window.scrollBy({ top: -ENGINE_CONFIG.scrollStepPx, behavior: 'auto' });
            } else if (e.key === 's' || e.key === 'S') {
                e.preventDefault();
                window.scrollBy({ top: ENGINE_CONFIG.scrollStepPx, behavior: 'auto' });
            }
        });

        const loginScreen = document.getElementById('login-screen');
        const loginUsernameEl = document.getElementById('login-username');
        const loginPasswordEl = document.getElementById('login-password');
        const loginErrorEl = document.getElementById('login-error');

        loginPasswordEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('login-submit').click();
        });

        // All'avvio, prova a scaricare il file manifest.json dalla cartella "dati"
        async function initBoot() {
            abortCurrentTyping();
            try {
                initSound();
                const response = await fetch('dati/manifest.json');
                if (!response.ok) throw new Error("Manifest non trovato");
                const tapes = await response.json();

                const publicTapes = tapes.filter(t => t.public === true);
                const hiddenTapes = tapes.filter(t => t.public !== true);

                // Ricostruisce la schermata iniziale con i file trovati
                bootScreen.innerHTML = '<h2>ROBCO INDUSTRIES - UNIFIED OPERATING SYSTEM</h2><p>SELEZIONARE ARCHIVIO DA CARICARE:</p>';

                publicTapes.forEach(tape => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = `[ ACCEDI: ${tape.nome} ]`;
                    btn.onclick = () => loadServerFile(tape.file);
                    bootScreen.appendChild(btn);
                });

                const separator = document.createElement('p');
                separator.textContent = '---';
                bootScreen.appendChild(separator);

                const hiddenInputEl = document.createElement('input');
                hiddenInputEl.type = 'text';
                hiddenInputEl.id = 'hidden-input';
                hiddenInputEl.placeholder = 'INSERISCI NOME ARCHIVIO';
                hiddenInputEl.autocomplete = 'off';
                bootScreen.appendChild(hiddenInputEl);

                const hiddenSubmitEl = document.createElement('button');
                hiddenSubmitEl.className = 'choice-btn';
                hiddenSubmitEl.id = 'hidden-submit';
                hiddenSubmitEl.textContent = '[ CARICA ]';
                bootScreen.appendChild(hiddenSubmitEl);

                const hiddenErrorEl = document.createElement('p');
                hiddenErrorEl.id = 'hidden-error';
                hiddenErrorEl.style.display = 'none';
                hiddenErrorEl.style.color = 'red';
                hiddenErrorEl.textContent = 'ARCHIVIO NON TROVATO';
                bootScreen.appendChild(hiddenErrorEl);

                const hiddenInput = document.getElementById('hidden-input');
                const hiddenError = document.getElementById('hidden-error');
                const hiddenSubmit = document.getElementById('hidden-submit');

                function lookupHidden() {
                    clickSound();
                    const value = hiddenInput.value.trim();
                    hiddenError.style.display = 'none';
                    if (!value) {
                        hiddenError.style.display = 'block';
                        return;
                    }
                    const match = hiddenTapes.find(t => t.id && t.id.toLowerCase() === value.toLowerCase());
                    if (match) {
                        loadServerFile(match.file);
                    } else {
                        hiddenError.style.display = 'block';
                    }
                }

                hiddenSubmit.onclick = lookupHidden;
                hiddenInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter') lookupHidden();
                });

                if (currentKeyHandler) document.removeEventListener('keydown', currentKeyHandler);
                const bootFocusables = Array.from(bootScreen.querySelectorAll('button, input'));
                currentKeyHandler = makeNavHandler(bootFocusables);
                document.addEventListener('keydown', currentKeyHandler);
                if (bootFocusables.length > 0) bootFocusables[0].focus();

            } catch (error) {
                abortCurrentTyping();
                bootScreen.innerHTML = `<h2 style="color:red">ERRORE DI RETE</h2><p>Impossibile comunicare con la cartella 'dati'.<br>${error.message}</p>`;
                const backBtn = document.createElement('button');
                backBtn.className = 'choice-btn';
                backBtn.textContent = '[ Torna al menu ]';
                backBtn.onclick = initBoot;
                bootScreen.appendChild(backBtn);
                if (currentKeyHandler) document.removeEventListener('keydown', currentKeyHandler);
                currentKeyHandler = makeNavHandler([backBtn]);
                document.addEventListener('keydown', currentKeyHandler);
                backBtn.focus();
            }
        }

        window.onload = initBoot;

        // Carica il file JSON specifico selezionato dall'utente
        async function loadServerFile(filename) {
            // Feedback visivo
            bootScreen.innerHTML = '<p>ESTRAZIONE DATI IN CORSO...</p><span class="cursor">_</span>';
            dataTerminalSound();

            try {
                const res = await fetch('dati/' + filename);
                if (!res.ok) throw new Error("File corrotto o mancante");
                terminalData = await res.json();
                
                if (!terminalData['start']) throw new Error("Nodo 'start' mancante");

                // Finto tempo di caricamento (1.5 secondi) per immersione
                setTimeout(() => {
                    if (terminalData.login) {
                        const loggedUser = getLoggedInUser(terminalData.login);
                        if (!loggedUser) {
                            showLoginView(terminalData.login, (username) => {
                                startSystem(() => showAlreadyLoggedIn(username, () => loadNode('start')));
                            }, true);
                            return;
                        }
                    }
                    startSystem();
                }, 1500);

            } catch (error) {
                abortCurrentTyping();
                bootScreen.innerHTML = `<h2 style="color:red">ERRORE LETTURA</h2><p>${error.message}</p>`;
                const backBtn = document.createElement('button');
                backBtn.className = 'choice-btn';
                backBtn.textContent = '[ Torna al menu ]';
                backBtn.onclick = initBoot;
                bootScreen.appendChild(backBtn);
                if (currentKeyHandler) document.removeEventListener('keydown', currentKeyHandler);
                currentKeyHandler = makeNavHandler([backBtn]);
                document.addEventListener('keydown', currentKeyHandler);
                backBtn.focus();
            }
        }

        function startSystem(after) {
            bootScreen.style.display = 'none';
            terminalContainer.style.display = 'block';
            if (after) after();
            else loadNode('start');
        }

        function getLoginForNode(nodeId) {
            const node = terminalData[nodeId];
            return (node && node.login) ? node.login : null;
        }

        function getLoggedInUser(loginBlock) {
            for (const u of loginBlock.users) {
                if (loggedInUsers.has(u.username)) return u.username;
            }
            return null;
        }

        function showLoginView(loginBlock, onSuccess, isRootLogin) {
            loginUsernameEl.innerHTML = '';
            loginBlock.users.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.username;
                opt.textContent = u.username;
                loginUsernameEl.appendChild(opt);
            });
            loginPasswordEl.value = '';
            loginErrorEl.style.display = 'none';
            loginScreen.style.display = 'flex';

            const submitBtn = document.getElementById('login-submit');
            const backBtn = document.getElementById('login-back');
            const newSubmit = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newSubmit, submitBtn);
            const newBack = backBtn.cloneNode(true);
            backBtn.parentNode.replaceChild(newBack, backBtn);

            document.getElementById('login-submit').onclick = () => {
                clickSound();
                const selectedUser = loginBlock.users.find(u => u.username === loginUsernameEl.value);
                if (selectedUser && selectedUser.password === loginPasswordEl.value) {
                    loggedInUsers.set(selectedUser.username, true);
                    loginScreen.style.display = 'none';
                    onSuccess(selectedUser.username);
                } else {
                    loginErrorEl.style.display = 'block';
                }
            };

            document.getElementById('login-back').onclick = () => {
                loginScreen.style.display = 'none';
                if (isRootLogin) {
                    abortCurrentTyping();
                    terminalContainer.style.display = 'none';
                    bootScreen.style.display = 'flex';
                    navigationHistory = [];
                    initBoot();
                } else {
                    navigationHistory.pop();
                    const prev = navigationHistory[navigationHistory.length - 1];
                    if (prev !== undefined) {
                        loadNode(prev, true);
                    } else {
                        navigationHistory = [];
                        terminalContainer.style.display = 'none';
                        bootScreen.style.display = 'flex';
                        initBoot();
                    }
                }
            };

            if (currentKeyHandler) document.removeEventListener('keydown', currentKeyHandler);
            const loginFocusables = [
                loginUsernameEl,
                loginPasswordEl,
                document.getElementById('login-submit'),
                document.getElementById('login-back')
            ];
            currentKeyHandler = makeNavHandler(loginFocusables);
            document.addEventListener('keydown', currentKeyHandler);
            loginUsernameEl.focus();

        }

        function showAlreadyLoggedIn(username, onDone) {
            choicesDiv.style.display = 'none';
            choicesDiv.innerHTML = '';
            const speed = Math.round(ENGINE_CONFIG.typingSpeed * 0.5);
            autoFollowEnabled = true;
            typeWriterHTML(`<p>Utente ${username} connesso</p>`, contentDiv, () => {
                setTimeout(onDone, 2000);
            }, speed);
        }

        function renderNode(nodeId, node) {
            choicesDiv.style.display = 'none';
            choicesDiv.innerHTML = '';
            const speed = seenNodes.has(nodeId) ? ENGINE_CONFIG.typingSpeed * 0.25 : ENGINE_CONFIG.typingSpeed;
            seenNodes.add(nodeId);
            autoFollowEnabled = true;
            const htmlContent = marked.parse(node.text || '');
            if (htmlContent.trim()) typingSound.start();
            typeWriterHTML(htmlContent, contentDiv, () => {
                typingSound.stop();
                showChoices(node.choices);
            }, speed);
        }

        function loadNode(nodeId, isBack = false) {
            const node = terminalData[nodeId];
            if (!node) return;

            const loginBlock = getLoginForNode(nodeId);
            if (loginBlock) {
                const loggedUser = getLoggedInUser(loginBlock);
                if (!loggedUser) {
                    showLoginView(loginBlock, (username) => {
                        if (!isBack) navigationHistory.push(nodeId);
                        showAlreadyLoggedIn(username, () => renderNode(nodeId, node));
                    }, false);
                    return;
                }
                if (!isBack) navigationHistory.push(nodeId);
                showAlreadyLoggedIn(loggedUser, () => renderNode(nodeId, node));
                return;
            }

            if (!isBack) navigationHistory.push(nodeId);
            renderNode(nodeId, node);
        }

        function typeWriterHTML(html, element, callback, speed = ENGINE_CONFIG.typingSpeed, onChar) {
            if (currentTypingHandle && currentTypingHandle.isActive()) {
                currentTypingHandle.cancel();
            }

            function finish() {
                lastTypingEndAt = performance.now();
                if (callback) callback();
            }

            if (speed === 0) {
                element.innerHTML = html;
                currentTypingHandle = null;
                finish();
                return;
            }

            element.innerHTML = '';
            let i = 0;
            let isTag = false;
            let currentText = '';
            let done = false;
            let cancelled = false;

            const handle = {
                skip() {
                    if (done || cancelled) return;
                    done = true;
                    element.innerHTML = html;
                    currentTypingHandle = null;
                    finish();
                },
                cancel() {
                    if (done || cancelled) return;
                    cancelled = true;
                    done = true;
                    currentTypingHandle = null;
                },
                isActive() {
                    return !done && !cancelled;
                }
            };
            currentTypingHandle = handle;

            function type() {
                if (done || cancelled) return;
                if (i < html.length) {
                    const char = html.charAt(i);
                    currentText += char;

                    if (char === '<') isTag = true;
                    if (char === '>') isTag = false;

                    element.innerHTML = currentText;

                    if (!isTag && char.trim() !== '') {
                        if (onChar) onChar();
                        if (autoFollowEnabled) {
                            const rect = element.getBoundingClientRect();
                            if (rect.bottom > window.innerHeight) {
                                suppressNextScrollEvent = true;
                                element.scrollIntoView({ block: 'end', behavior: 'auto' });
                            }
                        }
                    }

                    i++;
                    setTimeout(type, isTag ? 0 : speed);
                } else {
                    done = true;
                    currentTypingHandle = null;
                    finish();
                }
            }
            type();
        }

        function addBtnSounds(btn) {
            btn.addEventListener('mouseenter', selectionSound);
            btn.addEventListener('click', () => { clickSound(); });
        }

        function makeNavHandler(focusables) {
            return function(e) {
                const el = document.activeElement;
                const idx = focusables.indexOf(el);
                if (idx === -1) return;
                const isSelect = el.tagName === 'SELECT';
                const isButton = el.tagName === 'BUTTON';

                if (e.key === 'ArrowDown' && !isSelect) {
                    e.preventDefault();
                    const next = focusables[(idx + 1) % focusables.length];
                    next.focus();
                    scrollFocusIntoViewIfNeeded(next);
                    selectionSound();
                } else if (e.key === 'ArrowUp' && !isSelect) {
                    e.preventDefault();
                    const prev = focusables[(idx - 1 + focusables.length) % focusables.length];
                    prev.focus();
                    scrollFocusIntoViewIfNeeded(prev);
                    selectionSound();
                } else if (e.key === 'Enter' && isButton) {
                    e.preventDefault();
                    el.click();
                } else if (e.key === 'Enter' && isSelect) {
                    e.preventDefault();
                    const next = focusables[(idx + 1) % focusables.length];
                    next.focus();
                    scrollFocusIntoViewIfNeeded(next);
                }
            };
        }

        function showChoices(choices) {
            choicesDiv.innerHTML = '';
            if (choices && choices.length > 0) {
                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.label;
                    btn.onclick = () => loadNode(choice.target);
                    addBtnSounds(btn);
                    choicesDiv.appendChild(btn);
                });
            }

            if (navigationHistory.length > 1) {
                const backBtn = document.createElement('button');
                backBtn.className = 'choice-btn';
                backBtn.textContent = "[ Torna al menu precedente ]";
                backBtn.onclick = goBack;
                addBtnSounds(backBtn);
                choicesDiv.appendChild(backBtn);
            }

            if (navigationHistory.length === 1) {
                const sep = document.createElement('p');
                sep.className = 'system-separator';
                sep.textContent = '---';
                choicesDiv.appendChild(sep);

                const exitBtn = document.createElement('button');
                exitBtn.className = 'choice-btn choice-btn-system';
                exitBtn.textContent = '[ disconnetti terminale ]';
                exitBtn.onclick = disconnectTerminal;
                addBtnSounds(exitBtn);
                choicesDiv.appendChild(exitBtn);
            }

            choicesDiv.style.display = 'block';

            if (currentKeyHandler) document.removeEventListener('keydown', currentKeyHandler);
            const buttons = Array.from(choicesDiv.querySelectorAll('button'));

            currentKeyHandler = function(e) {
                const idx = buttons.indexOf(document.activeElement);
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    const next = buttons[(idx + 1) % buttons.length];
                    next.focus();
                    scrollFocusIntoViewIfNeeded(next);
                    selectionSound();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    const prev = buttons[(idx - 1 + buttons.length) % buttons.length];
                    prev.focus();
                    scrollFocusIntoViewIfNeeded(prev);
                    selectionSound();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (performance.now() - lastTypingEndAt < ENGINE_CONFIG.postTypingEnterCooldownMs) return;
                    if (idx !== -1) document.activeElement.click();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    clickSound();
                    if (navigationHistory.length > 1) goBack();
                    else disconnectTerminal();
                }
            };

            document.addEventListener('keydown', currentKeyHandler);
            if (buttons.length > 0) {
                buttons[0].focus();
                scrollFocusIntoViewIfNeeded(buttons[0]);
            }
        }

        function goBack() {
            if (navigationHistory.length > 1) {
                navigationHistory.pop();
                const previousNode = navigationHistory[navigationHistory.length - 1];
                loadNode(previousNode, true);
            }
        }

        function disconnectTerminal() {
            abortCurrentTyping();
            terminalData = {};
            navigationHistory = [];
            seenNodes = new Set();
            if (currentKeyHandler) {
                document.removeEventListener('keydown', currentKeyHandler);
                currentKeyHandler = null;
            }
            terminalContainer.style.display = 'none';
            bootScreen.style.display = 'flex';
            initBoot();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
            });
        }
    </script>
